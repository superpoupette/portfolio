<section class="bloc section-cards">

    <div class="texte">
        <h2>Jeu de carte/tarot</h2>
        <p>Lorem ipsum dolor sit amet...</p>
    </div>

    <div class="cartes-wrapper">

    <div class="cartes">
        <div class="card"><img class="carte"></div>
        <div class="card"><img class="carte"></div>
        <div class="card"><img class="carte"></div>
    </div>

    <!-- Dos du paquet sous les cartes -->
    <div class="deck-crop">
        <img class="deck-back" src="Images/Jeux/Cartes/verso.png" alt="dos du paquet">
    </div>


</div>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const images = [];

    // A1 → A21
    for (let i = 1; i <= 21; i++) {
        images.push(`Images/Jeux/Cartes/A${i}.png`);
    }

    // c1 → c8
    for (let i = 1; i <= 8; i++) {
        images.push(`Images/Jeux/Cartes/c${i}.png`);
    }

    // C9 → C16
    for (let i = 9; i <= 16; i++) {
        images.push(`Images/Jeux/Cartes/C${i}.png`);
    }

    // E1 → E4
    for (let i = 1; i <= 4; i++) {
        images.push(`Images/Jeux/Cartes/E${i}.png`);
    }

    // K / P / t
    for (let i = 1; i <= 16; i++) {
        images.push(`Images/Jeux/Cartes/K${i}.png`);
        images.push(`Images/Jeux/Cartes/P${i}.png`);
        images.push(`Images/Jeux/Cartes/t${i}.png`);
    }

    // bonus
    images.push(`Images/Jeux/Cartes/Bonus.png`);

    const cartes = document.querySelectorAll(".carte");

    cartes.forEach(img => {
        const randomIndex = Math.floor(Math.random() * images.length);
        img.src = images[randomIndex];
    });

});
</script>
