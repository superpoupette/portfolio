<main>

<section class="bloc section-intro">

    <p>Voici quelques jeux personnalisés.</p>

    <h2>CLUEDO - 2026</h2>
    <p>Lorem ipsum dolor sit amet...</p>
</section>

<section class="bloc section-cards">

    <div class="texte">
        <h2>Jeu de carte/tarot</h2>
        <p>Lorem ipsum dolor sit amet...</p>
    </div>

    <div class="deck-container">
        <img id="deck" src="Images/Jeux/Cartes/verso.png" alt="paquet de cartes">

        <div class="cartes">
            <div class="card"><img class="carte"></div>
            <div class="card"><img class="carte"></div>
            <div class="card"><img class="carte"></div>
        </div>
    </div>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const images = [];

    for (let i = 1; i <= 21; i++) images.push(`Images/Jeux/Cartes/A${i}.png`);
    for (let i = 1; i <= 8; i++) images.push(`Images/Jeux/Cartes/c${i}.png`);
    for (let i = 9; i <= 16; i++) images.push(`Images/Jeux/Cartes/C${i}.png`);
    for (let i = 1; i <= 4; i++) images.push(`Images/Jeux/Cartes/E${i}.png`);

    for (let i = 1; i <= 16; i++) {
        images.push(`Images/Jeux/Cartes/K${i}.png`);
        images.push(`Images/Jeux/Cartes/P${i}.png`);
        images.push(`Images/Jeux/Cartes/t${i}.png`);
    }

    images.push(`Images/Jeux/Cartes/Bonus.png`);

    const cards = document.querySelectorAll(".carte");
    const deck = document.getElementById("deck");

    function tirerMain() {

        cards.forEach((img, index) => {

            // reset animation propre
            img.classList.remove("deal");
            void img.offsetWidth;

            const randomIndex = Math.floor(Math.random() * images.length);
            img.src = images[randomIndex];

            setTimeout(() => {
                img.classList.add("deal");
            }, index * 150);

        });
    }

    tirerMain();
    deck.addEventListener("click", tirerMain);

});
</script>
